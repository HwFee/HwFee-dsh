<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">鹈鹕骑自行车</title>
  <desc id="svgDesc">一只白色鹈鹕蹬着青色自行车沿乡间小路前进：车轮转动，双腿跟着踏板起落，山丘、树木和路面标线缓缓后退。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d8f0"/>
      <stop offset="0.55" stop-color="#d9eff9"/>
      <stop offset="1" stop-color="#f6f7e9"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="415" x2="0" y2="515" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9d5c6"/>
      <stop offset="1" stop-color="#c1bcad"/>
    </linearGradient>

    <linearGradient id="grassGrad" x1="0" y1="515" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8ce7e"/>
      <stop offset="1" stop-color="#86b45c"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0.25" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f7ef"/>
      <stop offset="1" stop-color="#e2e9df"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#f8c862"/>
      <stop offset="1" stop-color="#ef9a35"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f9b26a"/>
      <stop offset="1" stop-color="#e87c33"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c8496"/>
      <stop offset="1" stop-color="#28616e"/>
    </linearGradient>

    <radialGradient id="shadowGrad">
      <stop offset="0" stop-color="#3f4b52" stop-opacity="0.3"/>
      <stop offset="0.65" stop-color="#3f4b52" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3f4b52" stop-opacity="0"/>
    </radialGradient>

    <!-- 车轮：所有轮辐与气门点随整只轮子一起旋转 -->
    <g id="wheelUnit">
      <circle r="65" fill="none" stroke="#39434b" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#59656d" stroke-width="3" stroke-dasharray="9 7" opacity="0.45"/>
      <circle r="55" fill="none" stroke="#cfd9dd" stroke-width="5"/>
      <g stroke="#e9f1f4" stroke-width="1.8">
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(30)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(60)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(90)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(120)"/>
        <line x1="-52" y1="0" x2="52" y2="0" transform="rotate(150)"/>
      </g>
      <circle cx="42" cy="0" r="3.5" fill="#f0a24a"/>
      <circle r="10" fill="#4c565e"/>
      <circle r="4" fill="#e9f0f2"/>
    </g>

    <!-- 远山的循环图块，宽 480，靠 x 偏移平铺 -->
    <g id="hillsFar">
      <path d="M0 415 L0 368 C 40 336 78 330 112 360 C 146 390 178 398 212 372 C 246 346 284 338 318 366 C 352 394 390 402 428 378 C 452 363 468 362 480 368 L480 415 Z"
            fill="#d3e8cf"/>
    </g>

    <g id="hillsMid">
      <path d="M0 415 L0 392 C 36 366 80 360 116 382 C 152 404 192 410 228 390 C 264 370 300 364 336 386 C 372 408 414 412 446 396 C 460 389 472 390 480 394 L480 415 Z"
            fill="#b9dcbb"/>
    </g>

    <!-- 中景树木与灌木 -->
    <g id="treesTile">
      <rect x="64" y="352" width="8" height="66" rx="3" fill="#9b7a58"/>
      <circle cx="68" cy="344" r="27" fill="#7fbe74"/>
      <circle cx="50" cy="358" r="18" fill="#8fc982"/>
      <circle cx="87" cy="356" r="17" fill="#72b268"/>

      <circle cx="196" cy="402" r="22" fill="#79b86e"/>
      <circle cx="216" cy="406" r="16" fill="#8ac57c"/>
      <circle cx="178" cy="408" r="14" fill="#6cae62"/>

      <rect x="322" y="368" width="7" height="50" rx="3" fill="#9b7a58"/>
      <circle cx="326" cy="358" r="22" fill="#83c178"/>
      <circle cx="308" cy="372" r="15" fill="#93cd85"/>

      <circle cx="424" cy="404" r="18" fill="#7ab96f"/>
      <circle cx="444" cy="408" r="13" fill="#8bc67d"/>
    </g>
  </defs>

  <!-- ================= 天空与云 ================= -->
  <rect x="0" y="0" width="960" height="420" fill="url(#skyGrad)"/>

  <g>
    <circle cx="800" cy="100" r="86" fill="#ffe9a8" opacity="0.3">
      <animate attributeName="r" values="84;92;84" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="100" r="54" fill="#ffeeb4" opacity="0.5"/>
    <circle cx="800" cy="100" r="38" fill="#fff4c9"/>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(150,96)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0;10 -3;0 0" dur="9s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="6" rx="52" ry="20"/>
        <circle cx="-24" cy="-4" r="20"/>
        <circle cx="8" cy="-12" r="26"/>
        <circle cx="34" cy="2" r="17"/>
      </g>
    </g>
    <g transform="translate(452,62)">
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0;-8 4;0 0" dur="11s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="4" rx="38" ry="15"/>
        <circle cx="-16" cy="-4" r="15"/>
        <circle cx="10" cy="-10" r="20"/>
      </g>
    </g>
  </g>

  <!-- ================= 远景视差 ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-480 0" dur="22s" repeatCount="indefinite"/>
    <use href="#hillsFar" x="-480"/>
    <use href="#hillsFar" x="0"/>
    <use href="#hillsFar" x="480"/>
    <use href="#hillsFar" x="960"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-480 0" dur="13s" repeatCount="indefinite"/>
    <use href="#hillsMid" x="-480"/>
    <use href="#hillsMid" x="0"/>
    <use href="#hillsMid" x="480"/>
    <use href="#hillsMid" x="960"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-480 0" dur="6s" repeatCount="indefinite"/>
    <use href="#treesTile" x="-480"/>
    <use href="#treesTile" x="0"/>
    <use href="#treesTile" x="480"/>
    <use href="#treesTile" x="960"/>
  </g>

  <!-- ================= 路面 ================= -->
  <rect x="0" y="415" width="960" height="100" fill="url(#roadGrad)"/>
  <path d="M0 415 H960" stroke="#a7a292" stroke-width="2.5" fill="none"/>
  <path d="M0 468 H960" stroke="#f3efdc" stroke-width="8" stroke-dasharray="44 76" stroke-linecap="round" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="0.42s" repeatCount="indefinite"/>
  </path>

  <rect x="0" y="515" width="960" height="45" fill="url(#grassGrad)"/>

  <g fill="#6f9e4f">
    <circle cx="30" cy="560" r="62"/>
    <circle cx="96" cy="574" r="46" opacity="0.92"/>
    <circle cx="924" cy="566" r="58"/>
    <circle cx="860" cy="576" r="40" opacity="0.92"/>
  </g>

  <!-- ================= 车下投影 ================= -->
  <ellipse cx="472" cy="420" rx="196" ry="17" fill="url(#shadowGrad)"/>

  <!-- ================= 远侧腿（在车架之后） ================= -->
  <g fill="none" stroke="#c9822f" stroke-linecap="round">
    <g transform="translate(450,258)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="53.26;39.82;26.02;23.32;34.3;51.2;62.73;61.75;53.26"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          dur="1.4s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="60" y2="0" stroke-width="12"/>
        <g transform="translate(60,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="79.69;99.09;104.41;92.31;69.76;46.91;39.32;55.57;79.69"
              keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
              dur="1.4s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="60" y2="0" stroke-width="9"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= 自行车 ================= -->
  <g>
    <!-- 车轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 345 350" to="360 345 350" dur="1.1s" repeatCount="indefinite"/>
      <use href="#wheelUnit" transform="translate(345,350)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 600 350" to="360 600 350" dur="1.1s" repeatCount="indefinite"/>
      <use href="#wheelUnit" transform="translate(600,350)"/>
    </g>

    <!-- 车架 -->
    <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M345 350 L465 350"/>
      <path d="M345 350 L398 272"/>
      <path d="M465 350 L398 270"/>
      <path d="M400 266 L585 242"/>
      <path d="M600 292 L465 350"/>
      <path d="M585 242 L600 292"/>
      <path d="M600 292 L600 350"/>
    </g>

    <!-- 车座 -->
    <g transform="translate(386,266) rotate(-4)">
      <path d="M-34 0 C -30 -8, -12 -11, 12 -7 C 26 -5, 32 2, 22 5 C 0 10, -22 9, -34 0 Z" fill="#3d454b"/>
      <path d="M-28 -1 C -16 -6, 2 -7, 16 -4" stroke="#5c666d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 车把 -->
    <g fill="none" stroke-linecap="round">
      <path d="M585 242 L580 228" stroke="#3c8496" stroke-width="8"/>
      <path d="M548 232 Q 582 220 616 228" stroke="#2f6f7e" stroke-width="8"/>
      <path d="M548 232 L556 231" stroke="#3d454b" stroke-width="12"/>
      <path d="M616 228 L609 228" stroke="#3d454b" stroke-width="12"/>
    </g>

    <!-- 链条与牙盘 -->
    <g fill="none">
      <path d="M345 339 L465 326 M345 361 L465 374" stroke="#98a5ab" stroke-width="3"/>
      <circle cx="345" cy="350" r="11" stroke="#aab6bb" stroke-width="4"/>
      <circle cx="465" cy="350" r="24" stroke="#aab6bb" stroke-width="4"/>
      <circle cx="465" cy="350" r="27" stroke="#8e9ba1" stroke-width="5" stroke-dasharray="3 5"/>
    </g>

    <!-- 曲柄与踏板：整组旋转，踏板反向自转保持水平 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 465 350" to="360 465 350" dur="1.4s" repeatCount="indefinite"/>
      <line x1="445" y1="350" x2="485" y2="350" stroke="#d3dadd" stroke-width="7" stroke-linecap="round"/>

      <g transform="translate(485,350)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0 0 0" to="-360 0 0" dur="1.4s" repeatCount="indefinite"/>
          <rect x="-11" y="-3.5" width="22" height="7" rx="3.5" fill="#4d575e"/>
          <path d="M-3 -5 C 5 -12, 17 -10, 22 -4 C 17 2, 5 5, -3 4 Z" fill="#eda248"/>
        </g>
      </g>

      <g transform="translate(445,350)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0 0 0" to="-360 0 0" dur="1.4s" repeatCount="indefinite"/>
          <rect x="-11" y="-3.5" width="22" height="7" rx="3.5" fill="#4d575e"/>
          <path d="M-3 -5 C 5 -12, 17 -10, 22 -4 C 17 2, 5 5, -3 4 Z" fill="#c9822f"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-1.1 450 258;1.1 450 258;-1.1 450 258"
                      dur="0.7s" repeatCount="indefinite"/>

    <!-- 脖子（先画，根部被身体盖住） -->
    <path d="M505 196 C 516 162, 544 134, 582 120" fill="none" stroke="#f7f9f2"
          stroke-width="46" stroke-linecap="round"/>

    <!-- 尾羽 -->
    <path d="M392 214 C 366 208, 342 196, 330 182 C 352 190, 374 194, 396 198 Z" fill="#eef2e9"/>
    <path d="M398 230 C 372 228, 346 220, 332 208 C 354 214, 378 218, 402 220 Z" fill="#e6ece2"/>

    <!-- 身体 -->
    <path d="M378 226 C 366 194, 386 160, 422 148 C 460 136, 508 146, 528 174
             C 546 200, 542 236, 516 254 C 490 271, 430 274, 402 258
             C 386 249, 376 238, 378 226 Z" fill="url(#bodyGrad)"/>
    <path d="M410 258 C 442 272, 492 268, 514 250 C 502 266, 466 274, 434 270 C 422 268, 414 264, 410 258 Z"
          fill="#dfe6da" opacity="0.7"/>

    <!-- 近侧翅膀，前伸搭在车把上 -->
    <path d="M466 186 C 502 168, 542 178, 568 198 C 588 212, 602 220, 610 226
             C 616 232, 610 240, 602 236 C 584 228, 560 220, 540 214
             C 514 230, 480 238, 462 226 C 448 214, 450 196, 466 186 Z" fill="#f4f7ee"/>
    <path d="M470 194 C 502 182, 536 190, 560 206" fill="none" stroke="#dbe3d6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M476 206 C 504 198, 532 204, 550 216" fill="none" stroke="#dbe3d6" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 头与冠羽 -->
    <circle cx="596" cy="114" r="33" fill="#fbfcf7"/>
    <path d="M574 86 C 570 74, 578 66, 586 72" fill="none" stroke="#f2c05a" stroke-width="6" stroke-linecap="round"/>
    <path d="M586 82 C 586 70, 596 64, 602 70" fill="none" stroke="#f2c05a" stroke-width="6" stroke-linecap="round"/>

    <!-- 喙与喉囊，轻微上下颤动 -->
    <g transform="translate(618,112)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0;1.6;0;-1.2;0" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-6 6 C 30 12, 80 22, 120 26 C 116 54, 92 80, 58 76 C 26 72, 2 44, -6 6 Z" fill="url(#pouchGrad)"/>
        <path d="M-10 -20 C 30 -16, 84 -4, 124 12 C 132 15, 132 24, 123 22 C 80 10, 34 6, -10 4 Z" fill="url(#beakGrad)"/>
        <path d="M120 20 C 128 22, 130 28, 124 30" fill="none" stroke="#d9832c" stroke-width="3" stroke-linecap="round"/>
        <path d="M-2 14 C 30 22, 70 34, 104 36" fill="none" stroke="#d8792f" stroke-width="2" opacity="0.55"/>
        <path d="M6 -8 C 14 -7, 22 -5, 28 -2" fill="none" stroke="#d79a3a" stroke-width="2" opacity="0.7"/>
      </g>
    </g>

    <!-- 眼睛，偶尔眨一下 -->
    <g transform="translate(604,102)">
      <circle r="8.5" fill="#ffffff"/>
      <g>
        <animateTransform attributeName="transform" type="scale"
                          values="1 1;1 1;1 0.15;1 1;1 1"
                          keyTimes="0;0.9;0.93;0.96;1"
                          dur="5.4s" repeatCount="indefinite"/>
        <circle r="6" fill="#33302c"/>
        <circle cx="-2" cy="-2" r="1.8" fill="#ffffff" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- ================= 近侧腿（在车架之前） ================= -->
  <g fill="none" stroke="#ec9d45" stroke-linecap="round">
    <g transform="translate(450,258)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="34.3;51.2;62.73;61.75;53.26;39.82;26.02;23.32;34.3"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          dur="1.4s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="60" y2="0" stroke-width="13"/>
        <g transform="translate(60,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="69.76;46.91;39.32;55.57;79.69;99.09;104.41;92.31;69.76"
              keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
              dur="1.4s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="60" y2="0" stroke-width="10"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
