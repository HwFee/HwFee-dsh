<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="Reasoning effort slider">
  <title>Reasoning effort slider</title>
  <!-- A track with a knob near the high end: the fill goes blue to violet, and the
       two dots beyond the knob are the starfield that lights up at the top level. -->
  <defs>
    <linearGradient id="ces-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d93f8"/>
      <stop offset="0.55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect x="3" y="15.5" width="30" height="5" rx="2.5" fill="#4d93f8" fill-opacity="0.18"/>
  <rect x="3" y="15.5" width="22" height="5" rx="2.5" fill="url(#ces-track)"/>
  <circle cx="25" cy="18" r="5.5" fill="#fff" stroke="#9333ea" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="31" cy="14" r="1.1" fill="#c084fc"/>
  <circle cx="33.5" cy="21" r="0.9" fill="#c084fc" fill-opacity="0.8"/>
</svg>
